name: django-braces

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", django: "4.2" }
          - { python-version: "3.10", django: "5.2" }
          - { python-version: "3.12", django: "4.2" }
          - { python-version: "3.12", django: "5.2" }
          - { python-version: "3.12", django: "6.0" }
          - { python-version: "3.13", django: "5.2" }
          - { python-version: "3.13", django: "6.0" }
          - { python-version: "3.14", django: "6.0" }

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Django~=${{ matrix.django }}.0
      - name: Run Tests
        run: |
          pytest --cov-report=xml
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true
      - name: Python Interrogate Check
        uses: JackMcKew/python-interrogate-check@main
        with:
          path: 'braces'
